# Render Blueprint for the paid FolioAI web app and its generation worker.
# Secret values are entered in Render and are never stored in this file.
services:
  - type: web
    name: folio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FOLIO_REQUIRE_POSTGRES
        value: "1"
      - key: FOLIO_PUBLIC_URL
        sync: false
      - key: FOLIO_SUPPORT_EMAIL
        sync: false
      - key: FOLIO_ADMIN_EMAILS
        sync: false
      - key: FOLIO_BUSINESS_NAME
        value: FolioAI
      - key: FOLIO_BUSINESS_COUNTRY
        value: Australia
      - key: FOLIO_BUSINESS_NUMBER
        sync: false
      - key: FOLIO_BUSINESS_ADDRESS
        sync: false
      - key: FOLIO_SUPPORT_PHONE
        sync: false
      - key: FOLIO_JOB_MODE
        # inline: the web service generates in a background thread,
        # which is what this deployment has always done. Switch to
        # queue only once the worker below is provisioned: in queue
        # mode the web service only enqueues, so without a worker
        # the site refuses every order (see generation_is_available).
        value: inline
      - key: FOLIO_REQUIRE_PAYMENTS
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SINGLE
        sync: false
      - key: STRIPE_PRICE_TERM
        sync: false
      - key: FOLIO_REQUIRE_EMAIL_VERIFICATION
        value: "1"
      - key: FOLIO_EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FOLIO_STORAGE_BUCKET
        value: booklets
      - key: FOLIO_COOKIE_SECURE
        value: "1"

# Background generation worker. Commented out because this account runs a
# single web service today, and a Blueprint sync that created the worker
# while the web service still said inline, or set queue while the worker
# did not exist, would break generation in one direction or the other.
#
# To enable queue mode: uncomment this block, deploy the worker, confirm
# /healthz reports worker healthy, then set FOLIO_JOB_MODE=queue above.
#
