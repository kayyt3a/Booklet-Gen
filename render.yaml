# Render Blueprint for the paid FolioAI web app and its generation worker.
# Secret values are entered in Render and are never stored in this file.
services:
  - type: web
    name: folio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # Entered once in Render and shared with the worker. Without the group
      # every secret has to be pasted twice, and the two copies drift.
      - fromGroup: folio-secrets
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FOLIO_REQUIRE_POSTGRES
        value: "1"
      - key: FOLIO_PUBLIC_URL
        sync: false
      - key: FOLIO_SUPPORT_EMAIL
        sync: false
      - key: FOLIO_ADMIN_EMAILS
        sync: false
      - key: FOLIO_BUSINESS_NAME
        value: FolioAI
      - key: FOLIO_BUSINESS_COUNTRY
        value: Australia
      - key: FOLIO_BUSINESS_NUMBER
        sync: false
      - key: FOLIO_BUSINESS_ADDRESS
        sync: false
      - key: FOLIO_SUPPORT_PHONE
        sync: false
      - key: FOLIO_JOB_MODE
        # auto: enqueue when a worker is alive, generate in-process when one
        # is not, decided per request. Nothing to flip and no ordering to get
        # right. Deploy the worker and it takes over; stop the worker and the
        # site keeps working rather than refusing orders.
        value: auto
      - key: FOLIO_REQUIRE_PAYMENTS
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SINGLE
        sync: false
      - key: STRIPE_PRICE_TERM
        sync: false
      - key: FOLIO_REQUIRE_EMAIL_VERIFICATION
        value: "1"
      - key: FOLIO_EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      - key: FOLIO_STORAGE_BUCKET
        value: booklets
      - key: FOLIO_COOKIE_SECURE
        value: "1"

# Background generation worker.
#
# The web service can generate in its own process, but a deploy or a restart
# kills a job that is running there, and a term plan runs for tens of minutes.
# The worker is a separate service, so shipping the website stops interrupting
# the work customers have paid for.
#
# FOLIO_JOB_MODE=auto on the web service means this needs no coordination: once
# this worker's heartbeat appears, new jobs are left for it. Until then, and
# again if it ever stops, the web service generates them itself.
  - type: worker
    name: folio-generator
    runtime: docker
    plan: starter
    # Long enough for an in-flight booklet to finish on a redeploy instead of
    # being killed and refunded.
    maxShutdownDelaySeconds: 300
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m booklet_gen.worker
    envVars:
      - fromGroup: folio-secrets
      - key: FOLIO_REQUIRE_POSTGRES
        value: "1"
      - key: FOLIO_STORAGE_BUCKET
        value: booklets
      - key: FOLIO_JOB_TIMEOUT
        value: "2700"
      - key: FOLIO_WORKER_POLL_SECONDS
        value: "2"

# Practice bank filler.
#
# A cron rather than a worker, and a separate service from folio-generator on
# purpose. The generator runs work a customer has paid for and is waiting on;
# this fills a question bank nobody is watching. Sharing a loop would let bank
# filling delay a booklet somebody bought.
#
# It runs at 00:15 Perth, when nothing else is competing for the connection
# pool. Most nights it should make no LLM calls at all: it tops up every
# shallow subtopic from the question families already banked before it
# considers generating a new one.
#
# FOLIO_PRACTICE_TEMPLATE_BUDGET_PER_DAY is the only thing standing between a
# bug and an overnight bill. It is read from practice_generation_log on every
# iteration, not held in the process, so this firing twice cannot spend it
# twice. 40 templates is roughly 2400 verified questions a night.
  - type: cron
    name: folio-practice-filler
    runtime: docker
    schedule: "15 16 * * *"        # 00:15 Perth (UTC+8)
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m booklet_gen.practice.filler --once
    envVars:
      - fromGroup: folio-secrets
      - key: FOLIO_REQUIRE_POSTGRES
        value: "1"
      - key: FOLIO_PRACTICE_TEMPLATE_BUDGET_PER_DAY
        value: "40"
      - key: FOLIO_PRACTICE_MIN_DEPTH
        value: "150"
      - key: FOLIO_PRACTICE_TARGET_DEPTH
        value: "400"
      - key: FOLIO_PRACTICE_INSTANCES_PER_TEMPLATE
        value: "60"

envVarGroups:
  # Created empty on the first Blueprint sync. Paste each value once in the
  # Render dashboard under Environment Groups, and both services get it.
  - name: folio-secrets
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
