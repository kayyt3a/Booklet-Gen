# Render Blueprint for the paid FolioAI web app and its generation worker.
# Secret values are entered in Render and are never stored in this file.
services:
  - type: web
    name: folio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FOLIO_REQUIRE_POSTGRES
        value: "1"
      - key: FOLIO_PUBLIC_URL
        sync: false
      - key: FOLIO_SUPPORT_EMAIL
        sync: false
      - key: FOLIO_ADMIN_EMAILS
        sync: false
      - key: FOLIO_BUSINESS_NAME
        value: FolioAI
      - key: FOLIO_BUSINESS_COUNTRY
        value: Australia
      - key: FOLIO_BUSINESS_NUMBER
        sync: false
      - key: FOLIO_BUSINESS_ADDRESS
        sync: false
      - key: FOLIO_SUPPORT_PHONE
        sync: false
      - key: FOLIO_JOB_MODE
        value: queue
      - key: FOLIO_REQUIRE_PAYMENTS
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SINGLE
        sync: false
      - key: STRIPE_PRICE_TERM
        sync: false
      - key: FOLIO_REQUIRE_EMAIL_VERIFICATION
        value: "1"
      - key: FOLIO_EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FOLIO_STORAGE_BUCKET
        value: booklets
      - key: FOLIO_COOKIE_SECURE
        value: "1"

  - type: worker
    name: folio-generator
    runtime: docker
    plan: starter
    maxShutdownDelaySeconds: 300
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m booklet_gen.worker
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FOLIO_REQUIRE_POSTGRES
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FOLIO_STORAGE_BUCKET
        value: booklets
      - key: FOLIO_JOB_TIMEOUT
        value: "2700"
      - key: FOLIO_WORKER_POLL_SECONDS
        value: "2"
