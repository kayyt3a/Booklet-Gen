# Render Blueprint for the Folio web app.
#
# To deploy:
#   1. Push this repo to GitHub (done).
#   2. In Render: New > Blueprint, connect this repo. Render reads this file
#      and creates the service below.
#   3. When prompted, paste values for FLASK_SECRET_KEY and GEMINI_API_KEY
#      (they are marked sync:false so they are NOT stored in the repo).
#   4. Deploy. Render builds the Dockerfile and gives you a public URL.
#
# Plan notes:
#   - `starter` because the free plan spins down after ~15 min idle and the
#     next request cold-starts in 30-60s. That is survivable for a demo and
#     not for a public site: the first visitor after a quiet spell is the one
#     deciding whether this looks like a real product.
#   - The `disk:` block below stays commented out on purpose. It exists to
#     persist /data, but generated PDFs are archived as blobs in Postgres
#     (db.save_job_file, served by views.download), and accounts, job history
#     and the RAG library live there too. Nothing that matters is on the
#     instance filesystem, so paying for a disk would buy nothing.

services:
  - type: web
    name: folio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      # Set these in the Render dashboard when prompted (never committed).
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Postgres connection string, from Neon / Supabase / Render Postgres.
      # This is what makes accounts survive restarts AND gives the deployed
      # app a real RAG library. Without it the app falls back to on-disk
      # SQLite + Chroma, which are wiped whenever the instance restarts.
      - key: DATABASE_URL
        sync: false
    # Only needed if PDFs ever stop being archived to Postgres. See the plan
    # note at the top of this file before uncommenting: as things stand this
    # would be paying for storage nothing reads.
    # disk:
    #   name: folio-data
    #   mountPath: /data
    #   sizeGB: 1
