<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Folio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="headerInner">
      <a class="brand" href="{{ url_for('views.index') }}">FOLIO <span>practice booklets</span></a>
      <nav class="nav">
        {% if g.user %}
          <a href="{{ url_for('views.index') }}"
             class="{{ 'active' if request.endpoint == 'views.index' }}">Create</a>
          <a href="{{ url_for('views.library') }}"
             class="{{ 'active' if request.endpoint == 'views.library' }}">My booklets</a>
          <a href="{{ url_for('views.account') }}"
             class="{{ 'active' if request.endpoint == 'views.account' }}">Account</a>
          <a href="{{ url_for('auth.logout') }}">Log out</a>
        {% else %}
          <a href="{{ url_for('auth.login') }}">Log in</a>
          <a href="{{ url_for('auth.signup') }}">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <div class="wrap">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
