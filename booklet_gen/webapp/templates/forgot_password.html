{% extends "base.html" %}
{% block title %}Reset your password - FolioAI{% endblock %}
{% block body %}
<div class="card narrow warm">
  <h1>Reset your password</h1>
  <p class="sub">Enter your account email and we will send a one-hour reset link.</p>
  <form method="post">
    {{ csrf_field() }}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus>
    <button type="submit">Send reset link</button>
  </form>
  <p class="muted authAside"><a class="link" href="{{ url_for('auth.login') }}">Back to login</a></p>
</div>
{% endblock %}
