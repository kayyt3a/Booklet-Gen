{% extends "base.html" %}
{% block title %}Sign up - Folio{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Create your account</h1>
  <p class="sub">Free to use. Generate practice booklets and exam papers, and
    keep them all in one place.</p>
  <form method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>
    <label for="password">Password <span class="muted" style="font-weight:500">(at least 8 characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="8" required>
    <button type="submit">Create account</button>
  </form>
  <p class="muted" style="margin-top:18px">Already have an account?
    <a class="link" href="{{ url_for('auth.login') }}">Log in</a>.</p>
</div>
{% endblock %}
